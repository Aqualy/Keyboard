# Hosts the configurator on Render as a static site, inside the "Keyboard Configurator" project.
projects:
  - name: Keyboard Configurator
    environments:
      - name: Production
        services:
          - type: web
            runtime: static
            name: gmk67-configurator
            branch: main
            buildCommand: npm ci && npm run build
            staticPublishPath: ./dist
            autoDeployTrigger: commit
            pullRequestPreviewsEnabled: false
            envVars:
              - key: NODE_VERSION
                value: '24'
            headers:
              # Vite puts a content hash in every file name under assets/, so they never change.
              - path: /assets/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
